# CI and production deploy (PRD sections 15D and 16, phase 12). The step-by-step setup is in docs/DEPLOY.md.
#
# Every push runs: typecheck, lint, Vitest, Playwright (with the axe scans) and a smoke test of a production build that
# starts with the full environment check switched on. A push to main also deploys to production, but only when every one
# of those passed, the launch checks passed, and the repository variable DEPLOY_ENABLED is "true".
#
# How the secrets are kept apart:
# - The Vercel token is used by exactly one job (deploy). That job runs no project code: no npm install, no scripts. It
#   uploads the source and Vercel builds it on Vercel's side, with the production settings that stay on Vercel.
# - Every job that runs project code (static, e2e, smoke, launch, live-smoke) has no secrets at all.
# - Put VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in the "production" environment, limited to the main branch.
#   See docs/DEPLOY.md.

name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces an older run on a branch. Never cancel a run on main, which may be deploying.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  static:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Say whether this run can deploy
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::notice::This run will not deploy. Only pushes to main deploy, and this one is on ${GITHUB_REF}."
          elif [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "::notice::This run will not deploy. Set the repository variable DEPLOY_ENABLED to true to switch deploys on (docs/DEPLOY.md, step 10)."
          else
            echo "::notice::This run will deploy to production if every check passes."
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    name: End-to-end and accessibility tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Playwright builds the site, starts it, runs every spec on desktop Chrome and the iPhone viewport, and stops it.
      # External services are stubbed in the specs, so no secrets are needed here. One spec also checks the built
      # client bundle for server secrets. The config stops a hung run after 20 minutes, so the report is still written.
      - run: npx playwright test
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  smoke:
    name: Smoke test of a production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Fake values that satisfy the environment check, so the site starts with validation ON (the e2e job turns it off).
    # Nothing here is a real secret. Cloudflare publishes the Turnstile keys below for testing: the site key always
    # passes, and the secret key always fails, so the smoke test can check that a fake token is refused.
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3101
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 2x0000000000000000000000000000000AA
      SUPABASE_URL: http://127.0.0.1:9
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
      RESEND_API_KEY: re_ci_dummy_key
      EMAIL_FROM: CI <hello@example.com>
      EMAIL_REPLY_TO: founder@example.com
      FOUNDER_EMAIL: founder@example.com
      UPSTASH_REDIS_REST_URL: http://127.0.0.1:9
      UPSTASH_REDIS_REST_TOKEN: ci-dummy-token
      UNSUBSCRIBE_SECRET: ci-dummy-unsubscribe-secret-not-for-production-use
      IP_HASH_SALT: ci-dummy-ip-hash-salt-not-for-production-use-abc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # The dummy values above are in the environment, so this also looks for them in the browser files.
      - run: npm run check:bundle
      - name: Start the site
        run: |
          npm run start -- --port 3101 > server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl --silent --fail http://localhost:3101/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          echo '::error::The site did not start within 30 seconds. Server log:'
          cat server.log
          exit 1
      - run: npm run smoke -- http://localhost:3101
      - name: Show the server log
        if: ${{ failure() }}
        run: cat server.log

  audit:
    name: Dependency audit (does not block deploys)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Production dependencies only. The one advisory in the lint tooling has no fix and never ships to users.
      - run: npm audit --omit=dev --audit-level=high

  launch:
    name: Launch checks (no placeholders, live address)
    needs: [static, e2e, smoke]
    # Only from main, only after every check above passed, and only once you have switched deploys on with the
    # REPOSITORY variable DEPLOY_ENABLED (Settings > Secrets and variables > Actions > Variables). An environment
    # variable would not work here, because this condition is read before any environment is chosen.
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The live address, for example https://example.co.uk. It must be a repository variable too.
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Fails while any [BRAND], [DOMAIN] or other placeholder is left in src/content/, or when SITE_URL is not an
      # https:// address on the same domain as site.ts.
      - run: npm run check:launch

  deploy:
    name: Deploy to Vercel (production)
    needs: [launch]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    # One production deploy at a time. A second one waits for the first to finish and never cancels it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    env:
      VERCEL_CLI_VERSION: 62.7.0
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      # Pinned to a full commit, because this is the job that holds the Vercel token. No npm install happens here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Checked here, in the same job as the deploy, so that "Re-run failed jobs" on an old run checks it again.
      # An older commit must never go live over a newer one.
      - name: Compare this commit with the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ -z "$latest" ]; then
            echo '::error::Could not read the tip of main from GitHub.'
            exit 1
          fi
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not deploying. main has moved on to ${latest}, so commit ${GITHUB_SHA} is not the newest."
          fi
      # Vercel builds the site on its side, with the production settings stored in the project, so none of them reach
      # this runner. This step runs only Vercel's own command line tool.
      - name: Deploy
        id: deploy
        if: ${{ steps.tip.outputs.current == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          output=$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prod --yes)
          url=$(printf '%s\n' "$output" | tail -n 1 | tr -d '\r')
          case "$url" in
            https://*) ;;
            *)
              echo "::error::Vercel did not print a deployment URL. It printed: ${output}"
              exit 1
              ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url, live at $SITE_URL" >> "$GITHUB_STEP_SUMMARY"

  live-smoke:
    name: Smoke test of the live site
    needs: [deploy]
    if: ${{ needs.deploy.outputs.deployed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The new deployment can take a short while to take over the domain, so a failed run is tried again a few times.
      # Exit code 3 means the live site accepted a fake bot-check token. That is a mistake in the settings, and trying
      # again would only save more junk, so it stops at once.
      - name: Smoke test
        run: |
          for attempt in 1 2 3 4; do
            rc=0
            npm run smoke -- "$SITE_URL" --launch || rc=$?
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$rc" -eq 3 ]; then
              echo '::error::The live site accepted a made-up bot-check token. Put the real Turnstile secret key in Vercel (Production), deploy again, and delete the junk report row in Supabase (docs/DEPLOY.md, step 4).'
              exit 3
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Attempt ${attempt} failed. Waiting for the new deployment to take over the domain..."
              sleep 30
            fi
          done
          echo "::error::The live site failed its smoke test. To go back to the previous version, use Instant Rollback in the Vercel dashboard (docs/DEPLOY.md, \"If something goes wrong\")."
          exit 1
